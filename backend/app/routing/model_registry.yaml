# Ordered model candidates per capability. quality_rank: lower = tried first.
# This file is the single place to update as better free models become available —
# nothing in app/routing/*.py or app/pipeline/*.py should ever hardcode a model name.
#
# requires_env: candidate is skipped (not an error) if none of these env vars are set.
# tier: cloud | local. Local candidates are always ranked last within a capability —
# the router additionally hard-excludes local candidates from `vision` unless every
# cloud vision candidate is unavailable/cooling down (handwriting OCR quality gap).
#
# Gemini model names below were corrected live on 2026-08-25: gemini-2.5-flash,
# gemini-2.0-flash, gemini-2.5-flash-lite and gemini-2.0-flash-lite all now 404 --
# Google's own error body names the replacements (gemini-3.6-flash, gemini-3.5-flash-lite).
# Multiple names are still listed deliberately: each has its own capacity pool, so one
# being busy (503) doesn't take the others down with it. Same API key works for all.

vision:
  - id: gemini-vision-1
    provider: gemini
    model: gemini-flash-latest
    quality_rank: 1
    tier: cloud
    requires_env: [GEMINI_API_KEYS]

  - id: gemini-vision-2
    provider: gemini
    model: gemini-3.6-flash
    quality_rank: 2
    tier: cloud
    requires_env: [GEMINI_API_KEYS]

  - id: gemini-vision-3
    provider: gemini
    model: gemini-3.5-flash-lite
    quality_rank: 3
    tier: cloud
    requires_env: [GEMINI_API_KEYS]

  - id: gemini-vision-4
    provider: gemini
    model: gemini-pro-latest
    quality_rank: 4
    tier: cloud
    requires_env: [GEMINI_API_KEYS]

  - id: openai-vision
    provider: openai
    model: gpt-4o-mini
    quality_rank: 5
    tier: cloud
    requires_env: [OPENAI_API_KEY]

  - id: anthropic-vision
    provider: anthropic
    model: claude-haiku-4-5
    quality_rank: 6
    tier: cloud
    requires_env: [ANTHROPIC_API_KEY]

  - id: ollama-vision
    provider: ollama
    model: qwen2.5vl:7b
    quality_rank: 99  # last resort only — see tier note above
    tier: local
    requires_env: []

text:
